<meta name="theme-color" content="#a3201d">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,800;1,600&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700&display=swap">
<style>
/* Layout: Werkstatt-Mappe. Kopfband mit Logo, darunter Reiter; Projekte als Karteikarten, Kalkulation als Kassenzettel. */
:root {
  --paper: #f6efe2;
  --card: #fffaf1;
  --ink: #3a1d17;
  --muted: #7a6152;
  --line: #e2d3b9;
  --red: #a3201d;
  --red-ink: #fff7ec;
  --gold: #a87b2e;
  --green: #2e5a3c;
  --danger: #b3261e;
  --shadow: 0 1px 0 rgba(90, 50, 20, .06), 0 6px 18px -10px rgba(90, 50, 20, .35);
  --f-display: "Playfair Display", "Georgia", "Times New Roman", serif;
  --f-body: "Nunito Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --radius: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #1c1412; --card: #281d19; --ink: #f3e7d3; --muted: #bba48f; --line: #47362d;
    --red: #d8463d; --red-ink: #1c1412; --gold: #d9ab5c; --green: #82b592; --danger: #ff8a80;
    --shadow: 0 1px 0 rgba(0,0,0,.3), 0 8px 20px -12px rgba(0,0,0,.7);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #1c1412; --card: #281d19; --ink: #f3e7d3; --muted: #bba48f; --line: #47362d;
  --red: #d8463d; --red-ink: #1c1412; --gold: #d9ab5c; --green: #82b592; --danger: #ff8a80;
  --shadow: 0 1px 0 rgba(0,0,0,.3), 0 8px 20px -12px rgba(0,0,0,.7);
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--paper); color: var(--ink);
  font-family: var(--f-body); font-size: 16px; line-height: 1.5;
  margin: 0;
}
.wrap {
  max-width: 980px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 16px 96px;
}
h1, h2, h3 { font-family: var(--f-display); text-wrap: balance; margin: 0; line-height: 1.2; }
h2 { font-size: 1.6rem; color: var(--red); }
h3 { font-size: 1.2rem; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.small { font-size: .875rem; }

/* Kopf */
.banner { display: block; border: 2px solid var(--gold); border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow); background: #f6efe2; }
.banner img { display: block; width: 100%; max-height: 220px; object-fit: cover; object-position: center 45%; }
.brandline { display: flex; align-items: baseline; justify-content: space-between; gap: 8px 16px; flex-wrap: wrap; margin-top: 12px; }
.brandline h1 { font-size: 1.5rem; color: var(--red); font-style: italic; }
.brandline .muted { font-size: .9rem; }

/* Reiter */
nav.tabs { display: flex; gap: 6px; margin: 16px 0 20px; border-bottom: 2px solid var(--line); overflow-x: auto; }
nav.tabs button {
  appearance: none; border: 0; background: none; color: var(--muted);
  font: 700 .95rem var(--f-body); padding: 10px 14px; border-bottom: 3px solid transparent; margin-bottom: -2px;
  cursor: pointer; white-space: nowrap; letter-spacing: .02em;
}
nav.tabs button[aria-selected="true"] { color: var(--red); border-bottom-color: var(--red); }

/* Knöpfe & Felder */
.btn {
  appearance: none; display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  border: 1.5px solid var(--red); background: var(--red); color: var(--red-ink);
  font: 700 .95rem var(--f-body); padding: 9px 14px; border-radius: 8px; cursor: pointer; min-height: 42px;
  text-decoration: none;
}
.btn.ghost { background: transparent; color: var(--red); }
.btn.quiet { background: transparent; color: var(--muted); border-color: var(--line); }
.btn.danger { background: transparent; color: var(--danger); border-color: var(--danger); }
.btn.sm { padding: 5px 10px; min-height: 34px; font-size: .85rem; }
.btn:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, nav.tabs button:focus-visible, .pcard:focus-visible {
  outline: 3px solid var(--gold); outline-offset: 2px;
}
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.row.between { justify-content: space-between; }
label.f { display: grid; gap: 4px; font-size: .85rem; font-weight: 700; color: var(--muted); min-width: 0; }
input[type="text"], input[type="number"], select, textarea {
  font: 1rem var(--f-body); color: var(--ink); background: var(--card);
  border: 1.5px solid var(--line); border-radius: 8px; padding: 8px 10px; width: 100%; min-height: 42px;
}
textarea { min-height: 80px; resize: vertical; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
.unitfield { display: flex; gap: 6px; }
.unitfield input { flex: 1; min-width: 0; }
.unitfield select { width: auto; flex: none; }

/* Kategorien & Projektkarten */
.cat { margin-bottom: 28px; }
.cat-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; padding-bottom: 8px; border-bottom: 1px dashed var(--gold); margin-bottom: 12px; }
.cat-head h2 { font-size: 1.35rem; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 14px; }
.pcard {
  background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow);
  overflow: hidden; cursor: pointer; display: flex; flex-direction: column; text-align: left; padding: 0; font: inherit; color: inherit;
}
.pcard .thumb { aspect-ratio: 4 / 3; background: repeating-linear-gradient(45deg, var(--paper) 0 10px, var(--card) 10px 20px); display: grid; place-items: center; color: var(--muted); font-size: .85rem; max-width: 100%; }
.pcard .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.pcard .body { padding: 10px 12px 12px; display: grid; gap: 2px; }
.pcard .name { font-family: var(--f-display); font-size: 1.1rem; font-weight: 600; }
.pcard .price { font-weight: 800; color: var(--green); font-size: 1.05rem; }
.badge { display: inline-block; font-size: .7rem; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--gold); border: 1px solid var(--gold); border-radius: 999px; padding: 1px 8px; vertical-align: middle; }
.empty { border: 1.5px dashed var(--line); border-radius: var(--radius); padding: 18px; color: var(--muted); text-align: center; }

/* Projekt-Detail */
.section { margin-top: 26px; }
.section > h3 { margin-bottom: 10px; color: var(--ink); }
.photos { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 10px; }
.photo { position: relative; aspect-ratio: 1; border-radius: 8px; overflow: hidden; border: 1px solid var(--line); background: var(--card); max-width: 100%; }
.photo img { width: 100%; height: 100%; object-fit: cover; display: block; cursor: zoom-in; }
.photo .x { position: absolute; top: 4px; right: 4px; width: 30px; height: 30px; border-radius: 50%; border: 0; background: rgba(0,0,0,.6); color: #fff; font-size: 18px; line-height: 1; cursor: pointer; }
.photo .cover { position: absolute; left: 4px; bottom: 4px; font-size: .7rem; font-weight: 800; background: rgba(0,0,0,.6); color: #fff; border-radius: 4px; padding: 1px 6px; }
.hidden-input { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }

.lines { display: grid; gap: 10px; }
.line {
  background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px;
  display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px 14px; align-items: start;
}
.line .lname { font-weight: 700; }
.line .lmeta { font-size: .82rem; color: var(--muted); }
.line .lcost { font-weight: 800; font-size: 1.1rem; text-align: right; white-space: nowrap; }
.line .usage { grid-column: 1 / -1; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.line .usage input { width: 64px; min-width: 0; }
/* Zahl und Einheit als ein Feld: [ 20 |cm ] */
.pair { display: inline-flex; align-items: stretch; flex: none; }
.pair input { border-radius: 8px 0 0 8px; border-right: 0; text-align: right; }
.pair select { width: auto; min-height: 42px; border-radius: 0 8px 8px 0; padding: 0 2px 0 6px; font-size: .8rem; color: var(--muted); background: var(--paper); }
.line .lactions { grid-column: 1 / -1; display: flex; gap: 8px; justify-content: flex-end; border-top: 1px dashed var(--line); padding-top: 8px; }
.line .usage .times { color: var(--muted); font-weight: 700; }
.line .usage .grow { flex: 1; }

/* Kassenzettel */
.receipt {
  background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow);
  padding: 16px 18px; display: grid; gap: 8px; position: relative;
}
.receipt::before { content: ""; position: absolute; inset: 0 0 auto; height: 5px; border-radius: var(--radius) var(--radius) 0 0; background: repeating-linear-gradient(90deg, var(--red) 0 14px, var(--gold) 14px 18px, var(--green) 18px 32px, var(--gold) 32px 36px); }
.rrow { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; }
.rrow.sum { border-top: 1px dashed var(--line); padding-top: 8px; font-weight: 700; }
.rrow.total { border-top: 2px solid var(--ink); padding-top: 10px; font-family: var(--f-display); font-size: 1.5rem; font-weight: 800; color: var(--green); }
.rinputs { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin-bottom: 6px; }

/* Status & Filter */
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { appearance: none; border: 1.5px solid var(--line); background: var(--card); color: var(--muted); font: 700 .85rem var(--f-body); padding: 5px 12px; border-radius: 999px; cursor: pointer; min-height: 34px; }
.chip[aria-pressed="true"] { border-color: var(--red); color: var(--red); }
.badge.done { color: var(--green); border-color: var(--green); }
.status { display: inline-flex; align-items: center; gap: 6px; font-weight: 800; font-size: .85rem; color: var(--green); }
.status.open { color: var(--gold); }

/* Nachbauen */
.repeat { background: var(--card); border: 1.5px solid var(--green); border-radius: var(--radius); padding: 14px 16px; display: grid; gap: 12px; }
.repeat .qtyrow { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.repeat .qtyrow input { width: 80px; }
.need { list-style: none; margin: 0; padding: 0; display: grid; gap: 0; }
.need li { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 2px 10px; align-items: start; padding: 9px 0; border-top: 1px dashed var(--line); }
.need li:first-child { border-top: 0; }
.need input[type="checkbox"] { width: 22px; height: 22px; margin: 2px 0 0; accent-color: var(--green); }
.need .nname { font-weight: 700; }
.need .namount { font-size: .9rem; }
.need .npack { font-size: .8rem; color: var(--muted); }
.need .ncost { font-weight: 700; white-space: nowrap; text-align: right; }
.need li.got .nname, .need li.got .namount { text-decoration: line-through; color: var(--muted); }
.history { font-size: .85rem; color: var(--muted); margin: 0; padding-left: 18px; }

/* Abgleich */
.syncchip { font-size: .8rem; font-weight: 700; color: var(--muted); display: inline-flex; align-items: center; gap: 6px; }
.syncchip::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--line); }
.syncchip.ok::before { background: var(--green); }
.syncchip.busy::before { background: var(--gold); }
.syncchip.err::before { background: var(--danger); }
.loginbox { display: grid; gap: 12px; max-width: 420px; }

/* Lager */
.mat { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 4px 12px; align-items: center; }
.mat .mname { font-weight: 700; }
.mat .mmeta { font-size: .85rem; color: var(--muted); grid-column: 1; }
.mat .mside { grid-row: 1 / span 2; grid-column: 2; display: flex; gap: 6px; }
.typechip { font-size: .7rem; font-weight: 800; text-transform: uppercase; letter-spacing: .07em; color: var(--green); }

/* Dialoge */
dialog { border: 1px solid var(--line); border-radius: 14px; background: var(--card); color: var(--ink); padding: 0; width: min(560px, calc(100vw - 24px)); max-height: calc(100vh - 32px); box-shadow: 0 20px 60px -20px rgba(0,0,0,.5); }
dialog::backdrop { background: rgba(30, 15, 10, .55); }
dialog form, dialog .dbody { padding: 18px; display: grid; gap: 14px; }
dialog h3 { color: var(--red); }
.lightbox { width: min(1000px, calc(100vw - 16px)); background: #000; border: 0; }
.lightbox img { display: block; max-width: 100%; max-height: calc(100vh - 80px); margin: 0 auto; }
.lightbox .row { padding: 8px; justify-content: flex-end; }

.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--paper); padding: 10px 16px; border-radius: 999px; font-weight: 700; font-size: .9rem; z-index: 50; box-shadow: var(--shadow); max-width: calc(100vw - 32px); }
.hint { font-size: .85rem; color: var(--muted); }
.preview-price { font-weight: 800; color: var(--green); }

@media (max-width: 520px) {
  h2 { font-size: 1.35rem; }
  .banner img { max-height: 150px; }
  .rrow.total { font-size: 1.3rem; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>

<!-- Material anlegen / bearbeiten -->
<dialog id="dlg-mat">
  <form id="form-mat" method="dialog">
    <h3 id="mat-title">Material anlegen</h3>
    <label class="f">Bezeichnung
      <input type="text" id="m-name" required placeholder="z. B. Bastelpapier rot, Rolle">
    </label>
    <label class="f">Wie wird es gekauft?
      <select id="m-type">
        <option value="area">Fläche – Rolle oder Bogen (Papier, Stoff, Filz)</option>
        <option value="length">Länge – Rolle (Draht, Band, Kordel)</option>
        <option value="piece">Stück – Packung (Perlen, Kugeln, Glöckchen)</option>
        <option value="weight">Gewicht (Wachs, Ton, Watte)</option>
        <option value="volume">Menge (Kleber, Farbe, Lack)</option>
      </select>

    <div class="grid2" id="m-fields"></div>
    <label class="f">Kaufpreis

<!-- Material zum Projekt hinzufügen -->

<dialog id="dlg-text">

<div id="toast" class="toast" hidden></div>

<script>
(() => {
'use strict';

/* ---------- Einheiten ---------- */
// Jedes Material wird intern in einer Grundeinheit gespeichert: cm, cm², Stück, g, ml.
const TYPES = {
  area:   { label: 'Fläche', base: 'cm²' },
  length: { label: 'Länge',  base: 'cm' },
  piece:  { label: 'Stück',  base: 'Stk.' },
  weight: { label: 'Gewicht', base: 'g' },
  volume: { label: 'Menge',  base: 'ml' },
};
const LEN = { mm: 0.1, cm: 1, m: 100 };
const WEIGHT = { g: 1, kg: 1000 };
const VOL = { ml: 1, l: 1000 };

function packTotal(m) {
  const p = m.pack || {};
  switch (m.type) {
    case 'area':   return num(p.length) * (LEN[p.lengthUnit] || 1) * num(p.width) * (LEN[p.widthUnit] || 1) * Math.max(1, num(p.count) || 1);
    case 'length': return num(p.length) * (LEN[p.lengthUnit] || 1) * Math.max(1, num(p.count) || 1);
    case 'piece':  return num(p.count);
    case 'weight': return num(p.amount) * (WEIGHT[p.unit] || 1);
    case 'volume': return num(p.amount) * (VOL[p.unit] || 1);
  }
  return 0;
}
function unitPrice(m) {
  const t = packTotal(m);
  return t > 0 ? num(m.price) / t : 0;
}
function usedAmount(m, u) {
  u = u || {};
  const qty = Math.max(0, u.qty === undefined || u.qty === '' ? 1 : num(u.qty));
  switch (m.type) {
    case 'area':   return num(u.a) * (LEN[u.aUnit] || 1) * num(u.b) * (LEN[u.bUnit] || 1) * qty;
    case 'length': return num(u.a) * (LEN[u.aUnit] || 1) * qty;
    case 'piece':  return num(u.a);
    case 'weight': return num(u.a) * (WEIGHT[u.aUnit] || 1);
    case 'volume': return num(u.a) * (VOL[u.aUnit] || 1);
  }
  return 0;
}
function lineCost(line) {
  const m = matById(line.materialId);
  return m ? unitPrice(m) * usedAmount(m, line.use) : 0;
}
function projectCalc(p) {
  const material = p.lines.reduce((s, l) => s + lineCost(l), 0);
  const minutes = num(p.minutes);
  const rate = p.rate === '' || p.rate === undefined ? num(state.settings.rate) : num(p.rate);
  const labor = minutes / 60 * rate;
  const extra = num(p.extra);
  const cost = material + labor + extra;
  const markupPct = p.markup === '' || p.markup === undefined ? num(state.settings.markup) : num(p.markup);
  const markup = cost * markupPct / 100;
  const net = cost + markup;
  const vatPct = num(state.settings.vat);
  const vat = net * vatPct / 100;
  return { material, minutes, rate, labor, extra, cost, markupPct, markup, net, vatPct, vat, gross: net + vat };
}

/* ---------- Zahlen ---------- */
function num(v) {
  if (typeof v === 'number') return isFinite(v) ? v : 0;
  if (v === undefined || v === null) return 0;
  let s = String(v).trim().replace(/\s/g, '');
  // Deutsche Schreibweise: 1.234,50 → 1234.50; ohne Komma gilt der Punkt als Dezimalzeichen.
  if (s.includes(',')) s = s.replace(/\./g, '').replace(',', '.');
  const n = parseFloat(s);
  return isFinite(n) ? n : 0;
}
const nf2 = new Intl.NumberFormat('de-DE', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
function money(v) { return nf2.format(v) + ' ' + state.settings.currency; }
// Kleine Beträge (Bruchteile eines Cents) mit mehr Stellen zeigen, damit 0,0046 € nicht als 0,00 € erscheint.
function moneyFine(v) {
  if (v === 0) return money(0);
  const abs = Math.abs(v);
  const digits = abs >= 1 ? 2 : abs >= 0.1 ? 3 : abs >= 0.01 ? 3 : 4;
  return new Intl.NumberFormat('de-DE', { minimumFractionDigits: 2, maximumFractionDigits: digits }).format(v) + ' ' + state.settings.currency;
}
function amountText(v) {
  return new Intl.NumberFormat('de-DE', { maximumFractionDigits: 2 }).format(v);
}
function unitPriceText(m) {
  const up = unitPrice(m);
  if (!up) return 'Preis und Menge eingeben';
  switch (m.type) {
    case 'area':   return moneyFine(up * 100) + ' pro 10×10 cm · ' + moneyFine(up * 10000) + ' pro m²';
    case 'length': return moneyFine(up * 100) + ' pro Meter · ' + moneyFine(up) + ' pro cm';
    case 'piece':  return moneyFine(up) + ' pro Stück';
    case 'weight': return moneyFine(up * 100) + ' pro 100 g';
    case 'volume': return moneyFine(up * 100) + ' pro 100 ml';
  }
  return '';
}
function packText(m) {
  const p = m.pack || {};
  const c = Math.max(1, num(p.count) || 1);
  const pre = c > 1 ? c + ' × ' : '';
  switch (m.type) {
    case 'area':   return pre + p.length + ' ' + p.lengthUnit + ' × ' + p.width + ' ' + p.widthUnit;
    case 'length': return pre + p.length + ' ' + p.lengthUnit;
    case 'piece':  return p.count + ' Stück';
    case 'weight': return p.amount + ' ' + p.unit;
    case 'volume': return p.amount + ' ' + p.unit;
  }
  return '';
}

/* ---------- Speicher (IndexedDB, sonst nur im Speicher) ---------- */
const DB_NAME = 'julekontor-bastel';
let dbp = null;
function db() {
  if (dbp) return dbp;
  dbp = new Promise((res, rej) => {
    try {
      const r = indexedDB.open(DB_NAME, 1);
      r.onupgradeneeded = () => { r.result.createObjectStore('kv'); r.result.createObjectStore('img'); };
      r.onsuccess = () => res(r.result);
      r.onerror = () => rej(r.error);
    } catch (e) { rej(e); }
  });
  return dbp;
}
const memImg = new Map();
let memState = null;
async function idb(store, mode, fn) {
  const d = await db();
  return new Promise((res, rej) => {
    const tx = d.transaction(store, mode);
    const req = fn(tx.objectStore(store));
    tx.oncomplete = () => res(req && req.result);
    tx.onerror = () => rej(tx.error);
  });
}
async function loadState() {
  try { return await idb('kv', 'readonly', s => s.get('state')); } catch (e) { return memState; }
}
let saveTimer = null;
// Jede Änderung: geänderte Einträge für den Abgleich markieren, auf dem Gerät speichern, Abgleich anstoßen.
function save() {
  trackChanges();
  persist();
  scheduleSync(2000);
}
function persist() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async () => {
    const copy = JSON.parse(JSON.stringify(state));
    const meta = JSON.parse(JSON.stringify(sync.meta));
    try { await idb('kv', 'readwrite', s => { s.put(meta, 'sync'); return s.put(copy, 'state'); }); } catch (e) { memState = copy; }
  }, 250);
}
async function putImg(id, blob) {
  memImg.set(id, blob);
  try { await idb('img', 'readwrite', s => s.put(blob, id)); } catch (e) {}
}
async function getLocalImg(id) {
  if (memImg.has(id)) return memImg.get(id);
  try { const b = await idb('img', 'readonly', s => s.get(id)); if (b) memImg.set(id, b); return b; } catch (e) { return null; }
}
// Fotos von anderen Geräten werden beim ersten Anzeigen vom Server geholt und danach auf dem Gerät behalten.
async function getImg(id) {
  const b = await getLocalImg(id);
  if (b || !sync.user) return b;
  try {
    const r = await fetch('api/img/' + id, { credentials: 'same-origin' });
    if (!r.ok) return null;
    const blob = await r.blob();
    await putImg(id, blob);
    sync.meta.uploaded[id] = 1; persist();
    return blob;
  } catch (e) { return null; }
}
async function delImg(id) {
  memImg.delete(id);
  const u = urlCache.get(id); if (u) { URL.revokeObjectURL(u); urlCache.delete(id); }
  try { await idb('img', 'readwrite', s => s.delete(id)); } catch (e) {}
}
const urlCache = new Map();
async function imgUrl(id) {
  if (urlCache.has(id)) return urlCache.get(id);
  const b = await getImg(id);
  if (!b) return null;
  const u = URL.createObjectURL(b);
  urlCache.set(id, u);
  return u;
}

/* ---------- Bilder verkleinern ---------- */
function shrink(file, max = 1600) {
  return new Promise((res) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      const s = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
      const c = document.createElement('canvas');
      c.width = Math.round(img.naturalWidth * s); c.height = Math.round(img.naturalHeight * s);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      c.toBlob(b => res(b || file), 'image/jpeg', 0.85);
    };
    img.onerror = () => { URL.revokeObjectURL(url); res(file); };
    img.src = url;
  });
}

    usage = `<input type="text" inputmode="decimal" data-u="a" value="${esc(u.a)}" aria-label="Anzahl"> <span class="small muted">Stück</span>`;
  } else if (m.type === 'weight') {
    usage = `${pair('a', 'aUnit', u, ['g', 'kg'], 'g', 'Gewicht')}`;
  } else {

  }

    <div style="min-width:0"><div class="lname">${esc(m.name)}</div><div class="lmeta">${esc(packText(m))} für ${money(num(m.price))} · ${unitPriceText(m)}</div></div>
    <div class="lcost num" data-cost="${l.id}">–</div>

}

/* ---------- Nachbauen ---------- */
const builtCount = p => (p.builds || []).reduce((s, b) => s + num(b.qty), 0);
function fmtBase(type, v) {
  const n = new Intl.NumberFormat('de-DE', { maximumFractionDigits: 2 });
  if (type === 'length') return v >= 100 ? n.format(v / 100) + ' m' : n.format(v) + ' cm';
  if (type === 'area') return v >= 10000 ? n.format(v / 10000) + ' m²' : n.format(v) + ' cm²';
  if (type === 'weight') return v >= 1000 ? n.format(v / 1000) + ' kg' : n.format(v) + ' g';
  if (type === 'volume') return v >= 1000 ? n.format(v / 1000) + ' l' : n.format(v) + ' ml';
  return n.format(v) + ' Stück';
}
function needText(m, u, n) {
  const qty = u.qty === undefined || u.qty === '' ? 1 : num(u.qty);
  const total = usedAmount(m, u) * n;
  if (m.type === 'area') return `${amountText(qty * n)} Stück à ${amountText(num(u.a))} ${u.aUnit || 'cm'} × ${amountText(num(u.b))} ${u.bUnit || 'cm'} <span class="muted">(${fmtBase('area', total)})</span>`;
  if (m.type === 'length') return qty * n > 1 ? `${amountText(qty * n)} × ${amountText(num(u.a))} ${u.aUnit || 'cm'} <span class="muted">(${fmtBase('length', total)})</span>` : fmtBase('length', total);
  return fmtBase(m.type, total);
}
function packWord(m, k) {
  if (m.type === 'area' || m.type === 'length') return k === 1 ? 'Rolle' : 'Rollen';
  return k === 1 ? 'Packung' : 'Packungen';
}
function repeatHtml(p) {
  const n = Math.max(1, Math.round(num(ui.repeatQty[p.id] ?? 1)));
  const hist = (p.builds || []).slice(-5).reverse();
  return `<div class="section" id="repeat">
    <h3>Nachbauen</h3>
    <div class="repeat">
      <div class="qtyrow">
        <label class="f" for="rep-qty" style="display:flex;align-items:center;gap:8px;color:var(--ink)">Wie viele Stück? <input type="text" inputmode="numeric" id="rep-qty" value="${n}"></label>
        <span class="hint">Liste zum Bereitlegen. Abhaken, was schon auf dem Tisch liegt.</span>
      </div>
      <ul class="need" id="need"></ul>
      <div id="rep-sum"></div>
      <div class="row between">
        <span class="small muted">${builtCount(p) ? `Bisher ${amountText(builtCount(p))} Stück gebaut` : 'Noch nicht nachgebaut'}</span>
        <button class="btn" id="rep-log">${n} Stück als gebaut eintragen</button>
      </div>
      ${hist.length ? `<ul class="history">${hist.map(b => `<li>${new Date(b.at).toLocaleDateString('de-DE')}: ${amountText(num(b.qty))} Stück</li>`).join('')}</ul>` : ''}
    </div>
  </div>`;
}
function updateRepeat(p) {
  const list = $('#need'); if (!list) return;
  const n = Math.max(1, Math.round(num(ui.repeatQty[p.id] ?? 1)));
  const checks = ui.checks[p.id] || (ui.checks[p.id] = {});
  list.innerHTML = p.lines.length ? p.lines.map(l => {
    const m = matById(l.materialId); if (!m) return '';
    const per = usedAmount(m, l.use), total = per * n, pack = packTotal(m);
    const packs = pack > 0 ? Math.ceil(total / pack - 1e-9) : 0;
    const perPack = per > 0 && pack > 0 ? Math.floor(pack / per + 1e-9) : 0;
    return `<li class="${checks[l.id] ? 'got' : ''}">
      <input type="checkbox" data-chk="${l.id}" ${checks[l.id] ? 'checked' : ''} aria-label="${esc(m.name)} bereitgelegt">
      <span style="min-width:0"><span class="nname">${esc(m.name)}</span><br><span class="namount">${needText(m, l.use, n)}</span><br>
        <span class="npack">${per > 0 ? `${packs || 1} ${packWord(m, packs || 1)} nötig · eine ${packWord(m, 1)} reicht für ${amountText(perPack)} Stück` : 'Verbrauch fehlt'}</span></span>
      <span class="ncost num">${moneyFine(unitPrice(m) * total)}</span>
    </li>`;
  }).join('') : '<li><span></span><span class="muted">Noch kein Material im Projekt.</span><span></span></li>';
  list.querySelectorAll('[data-chk]').forEach(c => c.onchange = () => { checks[c.dataset.chk] = c.checked; c.closest('li').classList.toggle('got', c.checked); });
  const c = projectCalc(p);
  const mins = c.minutes * n;
  const r = (label, val, cls = '') => `<div class="rrow ${cls}"><span>${label}</span><span class="num">${val}</span></div>`;
  $('#rep-sum').innerHTML = r(`Material für ${n} Stück`, money(c.material * n), 'sum') +
    r('Arbeitszeit', mins >= 60 ? `${Math.floor(mins / 60)} Std. ${Math.round(mins % 60)} Min.` : `${amountText(mins)} Min.`) +
    r(`Verkaufswert ${n} × ${money(c.gross)}`, money(c.gross * n), 'total');
  const btn = $('#rep-log'); if (btn) btn.textContent = `${n} Stück als gebaut eintragen`;
}
function bindRepeat(p) {
  const q = $('#rep-qty'); if (!q) return;
  q.addEventListener('input', () => { ui.repeatQty[p.id] = q.value; updateRepeat(p); });
  $('#rep-log').onclick = () => {

function updateSums(p) {

function blobToDataUrl(b) { return new Promise(r => { const fr = new FileReader(); fr.onload = () => r(fr.result); fr.readAsDataURL(b); }); }
async function exportBackup() {
  const images = {};
  for (const p of state.projects) for (const id of p.images) { const b = await getImg(id); if (b) images[id] = await blobToDataUrl(b); }
  const data = JSON.stringify({ app: 'julekontor-bastel', exported: new Date().toISOString(), state, images });
  const blob = new Blob([data], { type: 'application/json' });
  const name = 'julekontor-bastel-' + new Date().toISOString().slice(0, 10) + '.json';
  const file = new File([blob], name, { type: 'application/json' });
  try {
    if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: name }); return; }
  } catch (e) { if (e && e.name === 'AbortError') return; }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
  $('#exp-hint').textContent = 'Datei „' + name + '“ wurde erstellt. Falls nichts passiert, öffne die Werkstatt direkt im Browser.';
}
async function importBackup(e) {
  const f = e.target.files[0]; e.target.value = '';
  if (!f) return;
  try {
    const data = JSON.parse(await f.text());
    if (data.app !== 'julekontor-bastel' || !data.state) throw new Error('fremd');
    if (!(await askConfirm('Sicherung laden?', 'Alle jetzigen Daten auf diesem Gerät werden durch die Sicherung vom ' + new Date(data.exported).toLocaleDateString('de-DE') + ' ersetzt.', 'Laden'))) return;
    for (const p of state.projects) for (const id of p.images) await delImg(id);
    for (const [id, url] of Object.entries(data.images || {})) { const b = await (await fetch(url)).blob(); await putImg(id, b); }
    state = data.state; save(); ui.tab = 'projekte'; ui.projectId = null; render(); toast('Sicherung geladen');
  } catch (err) {
    toast('Diese Datei ist keine Sicherung der Bastelwerkstatt');
  }
}

/* ---------- Abgleich zwischen Geräten ----------
   Jede Kategorie, jedes Material, jedes Projekt und die Einstellungen sind ein Eintrag mit Änderungszeit (upd).
   Beim Abgleich gewinnt pro Eintrag die neuere Fassung. Fotos werden einzeln hoch- und heruntergeladen. */
const sync = { avail: false, user: null, busy: false, last: 0, err: '', pendingRender: false,
  meta: { lastSeq: 0, joined: false, dirty: {}, tomb: {}, uploaded: {} } };
let snap = new Map();
function entities(st) {
  const out = new Map();
  st.categories.forEach(c => out.set('cat:' + c.id, c));
  st.materials.forEach(m => out.set('mat:' + m.id, m));
  st.projects.forEach(p => out.set('proj:' + p.id, p));
  out.set('set:settings', st.settings);
  return out;
}
const bodyOf = o => { const { upd, ...r } = o; return JSON.stringify(r); };
function takeSnapshot() { snap = new Map(); for (const [k, o] of entities(state)) snap.set(k, bodyOf(o)); }
function trackChanges() {
  const t = Date.now(), cur = entities(state);
  for (const [k, o] of cur) {
    const b = bodyOf(o);
    if (snap.get(k) !== b) { o.upd = t; sync.meta.dirty[k] = t; delete sync.meta.tomb[k]; snap.set(k, b); }
  }
  for (const k of [...snap.keys()]) if (!cur.has(k)) { snap.delete(k); delete sync.meta.dirty[k]; sync.meta.tomb[k] = t; }
}
let syncTimer = null;
function scheduleSync(ms) { if (!sync.user) return; clearTimeout(syncTimer); syncTimer = setTimeout(runSync, ms); }
async function api(path, opt = {}) {
  const headers = typeof opt.body === 'string' ? { 'content-type': 'application/json' } : {};
  const r = await fetch('api/' + path, { credentials: 'same-origin', ...opt, headers: { ...headers, ...(opt.headers || {}) } });
  const data = (r.headers.get('content-type') || '').includes('json') ? await r.json() : null;
  if (r.status === 401 && path !== 'login') { sync.user = null; throw new Error('auth'); }
  if (!r.ok) throw Object.assign(new Error((data && data.error) || 'Fehler ' + r.status), { status: r.status });
  return data;
}
function applyRemote(items) {
  let changed = false;
  for (const it of items) {
    const i0 = it.key.indexOf(':'), kind = it.key.slice(0, i0), id = it.key.slice(i0 + 1);
    const localDirty = sync.meta.dirty[it.key];
    if (kind === 'set') {
      if (!it.deleted && it.data && it.upd > (state.settings.upd || 0) && !localDirty) { Object.assign(state.settings, it.data); changed = true; }
      continue;
    }
    const prop = kind === 'cat' ? 'categories' : kind === 'mat' ? 'materials' : kind === 'proj' ? 'projects' : null;
    if (!prop) continue;
    const list = state[prop], i = list.findIndex(x => x.id === id), local = list[i];
    if (it.deleted) {
      if (local && (local.upd || 0) <= it.upd) { list.splice(i, 1); delete sync.meta.dirty[it.key]; changed = true; }
    } else if (!local) {
      if (!(sync.meta.tomb[it.key] >= it.upd) && it.data) { list.push(it.data); changed = true; }
    } else if ((local.upd || 0) < it.upd && it.data) {
      // Gleiches Objekt behalten, damit eine gerade offene Ansicht weiter auf den richtigen Eintrag schreibt.
      for (const k of Object.keys(local)) delete local[k];
      Object.assign(local, it.data); delete sync.meta.dirty[it.key]; changed = true;
    }
  }
  if (changed) takeSnapshot();
  return changed;
}
async function firstJoin() {
  const r = await api('sync?since=0');
  const onlyExamples = state.projects.every(p => p.example) && state.materials.every(m => m.example);
  if (r.items.length && onlyExamples) {
    // Der Server hat schon Daten, dieses Gerät nur die Beispiele: Beispiele verwerfen, Serverdaten übernehmen.
    state = { v: 1, settings: { ...state.settings, upd: 0 }, categories: [], materials: [], projects: [] };
    sync.meta.dirty = {}; sync.meta.tomb = {};
  } else {
    // Alles, was auf diesem Gerät liegt, einmal hochladen.
    const t = Date.now();
    for (const [k, o] of entities(state)) { if (!o.upd) o.upd = t; sync.meta.dirty[k] = o.upd; }
  }
  applyRemote(r.items);
  takeSnapshot();
  sync.meta.joined = true; sync.meta.lastSeq = r.seq;
}
async function uploadImages() {
  for (const p of state.projects) for (const id of p.images) {
    if (sync.meta.uploaded[id]) continue;
    const b = await getLocalImg(id); if (!b) continue;
    await api('img/' + id, { method: 'PUT', body: b, headers: { 'content-type': b.type || 'image/jpeg' } });
    sync.meta.uploaded[id] = 1;
  }
}
async function runSync() {
  if (!sync.avail || !sync.user || sync.busy) return;
  if (!navigator.onLine) { sync.err = 'Offline. Wird später abgeglichen.'; paintSync(); return; }
  sync.busy = true; paintSync();
  let changed = false;
  try {
    if (!sync.meta.joined) { await firstJoin(); changed = true; }
    await uploadImages();
    const cur = entities(state), items = [], sent = {};
    for (const k of Object.keys(sync.meta.dirty)) { const o = cur.get(k); if (o) { items.push({ key: k, upd: o.upd, data: o }); sent[k] = sync.meta.dirty[k]; } else delete sync.meta.dirty[k]; }
    const tombs = { ...sync.meta.tomb };
    for (const [k, t] of Object.entries(tombs)) items.push({ key: k, upd: t, deleted: true });
    if (items.length) {
      await api('sync', { method: 'POST', body: JSON.stringify({ items }) });
      for (const k in sent) if (sync.meta.dirty[k] === sent[k]) delete sync.meta.dirty[k];
      for (const k in tombs) if (sync.meta.tomb[k] === tombs[k]) delete sync.meta.tomb[k];
    }
    const r = await api('sync?since=' + sync.meta.lastSeq);
    if (applyRemote(r.items)) changed = true;
    sync.meta.lastSeq = r.seq; sync.last = Date.now(); sync.err = '';
  } catch (e) {
    sync.err = e.message === 'auth' ? 'Bitte neu anmelden.' : navigator.onLine ? 'Server nicht erreichbar. Neuer Versuch gleich.' : 'Offline. Wird später abgeglichen.';
  }
  sync.busy = false;
  persist(); paintSync();
  if (changed) safeRender();
  if (ui.tab === 'einstellungen') renderSyncBox();
}
// Nicht neu zeichnen, während jemand tippt: sonst springt der Cursor weg.
function safeRender() {
  const a = document.activeElement;
  if (document.querySelector('dialog[open]') || (a && view.contains(a) && /INPUT|TEXTAREA|SELECT/.test(a.tagName))) { sync.pendingRender = true; return; }
  sync.pendingRender = false; render();
}
view.addEventListener('focusout', () => setTimeout(() => { if (sync.pendingRender) safeRender(); }, 300));
function paintSync() {
  const el = $('#syncchip'); if (!el) return;
  el.hidden = !sync.avail;
  el.className = 'syncchip ' + (!sync.user ? '' : sync.busy ? 'busy' : sync.err ? 'err' : 'ok');
  el.textContent = !sync.user ? 'Nicht angemeldet' : sync.busy ? 'Gleiche ab …' : sync.err ? sync.err
    : sync.last ? 'Abgeglichen ' + new Date(sync.last).toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' }) : 'Angemeldet';
}
function renderSyncBox() {
  const box = $('#sync-box'); if (!box) return;
  if (!sync.avail) {
    box.innerHTML = `<p class="muted" style="margin-top:0; max-width:60ch">Der Abgleich funktioniert, wenn du die Werkstatt über deinen Julekontor-Server öffnest (z. B. <strong>https://bastel.julekontor.dk</strong>). Dort meldest du dich am Handy und am PC mit demselben Zugang an, dann sind Projekte, Material und Fotos überall gleich.</p>`;
    return;
  }
  if (!sync.user) {
    box.innerHTML = `<form class="loginbox" id="login-form">
      <p class="muted" style="margin:0">Melde dich an, damit Projekte, Material und Fotos auf allen Geräten gleich sind.</p>
      <label class="f">E-Mail <input type="text" id="l-email" autocomplete="username" inputmode="email" required></label>
      <label class="f">Passwort <input type="password" id="l-pass" autocomplete="current-password" required style="font:1rem var(--f-body);color:var(--ink);background:var(--card);border:1.5px solid var(--line);border-radius:8px;padding:8px 10px;min-height:42px"></label>
      <div class="row"><button class="btn" type="submit">Anmelden</button><span class="hint" id="l-err"></span></div>
    </form>`;
    $('#login-form').onsubmit = async e => {
      e.preventDefault();
      $('#l-err').textContent = 'Melde an …';
      try {
        const r = await api('login', { method: 'POST', body: JSON.stringify({ email: $('#l-email').value, password: $('#l-pass').value }) });
        sync.user = r.user; sync.err = ''; paintSync(); renderSyncBox(); toast('Angemeldet'); runSync();
      } catch (err) { $('#l-err').textContent = err.message; }
    };
    return;
  }
  const open = Object.keys(sync.meta.dirty).length + Object.keys(sync.meta.tomb).length;
  box.innerHTML = `<div class="loginbox">
    <p style="margin:0">Angemeldet als <strong>${esc(sync.user)}</strong></p>
    <p class="hint" style="margin:0">${sync.last ? 'Zuletzt abgeglichen um ' + new Date(sync.last).toLocaleTimeString('de-DE') : 'Noch nicht abgeglichen'}${open ? ` · ${open} Änderung(en) warten` : ''}${sync.err ? ' · ' + esc(sync.err) : ''}</p>
    <p class="hint" style="margin:0">Änderungen gehen nach wenigen Sekunden an den Server. Andere Geräte holen sie alle 30 Sekunden und beim Öffnen der App.</p>
    <div class="row"><button class="btn" id="sync-now">Jetzt abgleichen</button><button class="btn quiet" id="sync-out">Abmelden</button></div>
  </div>`;
  $('#sync-now').onclick = runSync;
  $('#sync-out').onclick = async () => {
    try { await api('logout', { method: 'POST' }); } catch (e) {}
    sync.user = null; paintSync(); renderSyncBox(); toast('Abgemeldet. Die Daten bleiben auf diesem Gerät.');
  };
}
async function initSync() {
  try {
    const ctl = new AbortController(); setTimeout(() => ctl.abort(), 5000);
    const r = await fetch('api/me', { credentials: 'same-origin', signal: ctl.signal });
    const d = r.ok ? await r.json() : null;
    if (!d || d.app !== 'julekontor-bastel') return;
    sync.avail = true; sync.user = d.user;
  } catch (e) { return; }
  paintSync();
  if (ui.tab === 'einstellungen') renderSyncBox();
  if (sync.user) runSync();
  setInterval(runSync, 30000);
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') runSync(); });
  window.addEventListener('online', runSync);
}

(async () => {
  const loaded = await loadState();
  state = loaded && loaded.v ? loaded : sample();
  try { const m = await idb('kv', 'readonly', st => st.get('sync')); if (m) sync.meta = { ...sync.meta, ...m }; } catch (e) {}
  if (loaded) takeSnapshot(); else save();
  render();
  initSync();
})();
if ('serviceWorker' in navigator && location.protocol === 'https:' && !/claude/.test(location.hostname)) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
})();
