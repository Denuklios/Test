<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>Kamera Pro</title>
  <link rel="icon" href="icon.svg">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <main id="cam">
    <div id="finder">
      <canvas id="view"></canvas>
      <canvas id="overlay"></canvas>
      <div id="flashfx"></div>
      <div id="countdown" hidden></div>
    </div>

    <header id="topbar"></header>
    <div id="hud">
      <div id="rec" hidden><span class="dot"></span><span id="rectime">00:00</span></div>
      <div id="hint" hidden></div>
      <canvas id="panoPreview" hidden></canvas>
      <div id="progress" hidden><div></div></div>
    </div>
    <div id="histo" hidden><canvas width="128" height="48"></canvas></div>

    <div id="sidebar"></div>
    <div id="zoombar"></div>
    <section id="panel" hidden></section>
    <div id="modeopts"></div>
    <nav id="modes"></nav>
    <footer id="controls">
      <button id="thumb" aria-label="Galerie"><img alt=""></button>
      <button id="shutter" aria-label="Auslöser"><span></span></button>
      <button id="flip" aria-label="Kamera wechseln"></button>
    </footer>
    <div id="sheet" hidden></div>
    <div id="toast" hidden></div>
    <div id="busy" hidden><div class="spin"></div><p></p><div class="bar"><div></div></div></div>
  </main>

  <section id="gallery" class="screen" hidden></section>
  <section id="viewer" class="screen" hidden></section>
  <section id="editor" class="screen" hidden></section>

  <script src="vendor/jsQR.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
