# Lädt Website und Auftragsprogramm per SFTP auf www.wunsch-fabrik.dk (one.com).
#
# Läuft nur, wenn eine Änderung mit „[hochladen]“ in der Beschreibung hochgeschoben wird,
# oder von Hand (Actions → „Auf den Webspace hochladen“ → Run workflow).
#
# Zugangsdaten stehen nur bei GitHub (Settings → Secrets and variables → Actions):
#   FTP_SERVER (SFTP-Adresse, bei one.com ssh.wunsch-fabrik.dk), FTP_USERNAME, FTP_PASSWORD,
#   optional FTP_DIR (Ordner der Website auf dem Server, Standard: der Ordner direkt nach dem Einloggen)
#
# Auf dem Server bleibt unangetastet: db_config.php (liegt nicht bei GitHub), auftraege/data/ (Aufträge,
# Datenbank, Uploads) und anfrage-vorschau/ (Bilder aus Kundenanfragen). Gelöscht wird nichts.
name: Auf den Webspace hochladen

on:
  workflow_dispatch:
  push:
    branches: ['claude/focused-hawking-o04rw1']

concurrency:
  group: webspace-upload
  cancel-in-progress: false

jobs:
  hochladen:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[hochladen]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Paket zusammenstellen
        run: |
          set -e
          mkdir -p _upload/auftraege/data _upload/anfrage-vorschau
          rsync -a --exclude 'UPDATE-ANLEITUNG.md' --exclude 'anfrage-vorschau/' --exclude 'db_config.php' --exclude 'auftraege/' website/ _upload/
          cp website/anfrage-vorschau/.htaccess _upload/anfrage-vorschau/.htaccess
          rsync -a --exclude 'data/' --exclude 'tests/' --exclude 'inc/config.local.php' auftraege/ _upload/auftraege/
          printf 'Require all denied\nDeny from all\n' > _upload/auftraege/data/.htaccess
          test ! -e _upload/db_config.php
          echo "Dateien: $(find _upload -type f | wc -l), Größe: $(du -sh _upload | cut -f1)"

      - name: Per SFTP hochladen
        env:
          SFTP_HOST: ${{ secrets.FTP_SERVER }}
          SFTP_USER: ${{ secrets.FTP_USERNAME }}
          LFTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          SFTP_DIR: ${{ secrets.FTP_DIR }}
        run: |
          set -e
          if [ -z "$SFTP_HOST" ] || [ -z "$SFTP_USER" ] || [ -z "$LFTP_PASSWORD" ]; then
            echo "::error::FTP_SERVER, FTP_USERNAME und FTP_PASSWORD fehlen unter Settings → Secrets and variables → Actions."; exit 1
          fi
          sudo apt-get -qq update && sudo apt-get -qq install -y lftp >/dev/null
          # Nur hochladen und überschreiben, nie löschen: Dateien, die es hier nicht gibt (db_config.php,
          # auftraege/data/, anfrage-vorschau/), bleiben auf dem Server unangetastet.
          CONN="set sftp:auto-confirm yes; set net:max-retries 3; set net:timeout 30; open -u '$SFTP_USER' --env-password 'sftp://$SFTP_HOST'"
          DIR="${SFTP_DIR:-.}"
          # Ordner auf dem Server immer im Protokoll zeigen (hilft beim Einrichten)
          lftp -e "$CONN; echo '--- Ordner nach dem Login:'; cls -1F; echo '--- eine Ebene tiefer:'; cls -1F */; bye" || true
          # Sicherheitsprüfung: nur hochladen, wenn im Zielordner die echte Website liegt. Erkennungszeichen ist
          # db_config.php, die nur auf dem Server existiert und von hier nie hochgeladen wird.
          if ! lftp -e "$CONN; cls -1 '$DIR/db_config.php'; bye" 2>/dev/null | grep -q 'db_config.php'; then
            echo "::error::Im Zielordner '$DIR' liegt keine db_config.php – das ist nicht der Website-Ordner. FTP_DIR anpassen."
            exit 1
          fi
          lftp -e "$CONN; mirror --reverse --no-perms --parallel=4 --verbose=1 ./_upload/ '$DIR'; bye"
