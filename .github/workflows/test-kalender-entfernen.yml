# Einmalig: entfernt den alten Test-Kalender (teSt/kalender) vom Webspace – auf Wunsch des Nutzers.
# Läuft nur bei einem Commit mit „[test-kalender-entfernen]“. Löscht ausschließlich teSt/kalender,
# und nur, wenn dort die api.php des Familienkalenders liegt.
name: Test-Kalender entfernen

on:
  push:
    branches: ['claude/shared-calendar-app-n7v6p2']

concurrency:
  group: webspace-upload
  cancel-in-progress: false

jobs:
  entfernen:
    if: contains(github.event.head_commit.message, '[test-kalender-entfernen]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: teSt/kalender löschen
        env:
          SFTP_HOST: ${{ secrets.FTP_SERVER }}
          SFTP_USER: ${{ secrets.FTP_USERNAME }}
          LFTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          SFTP_DIR: ${{ secrets.FTP_DIR }}
        run: |
          set -e
          sudo apt-get -qq update && sudo apt-get -qq install -y lftp >/dev/null
          CONN="set sftp:auto-confirm yes; set net:max-retries 3; set net:timeout 30; open -u '$SFTP_USER' --env-password 'sftp://$SFTP_HOST'"
          if [ -n "$SFTP_DIR" ]; then CANDS="$SFTP_DIR"; else
            LIST=$(lftp -e "$CONN; cls -1 webroots/ webroots/by-route/; bye" 2>/dev/null | sed 's#/*$##; s#@$##' || true)
            CANDS="$LIST httpd.www ."
          fi
          FOUND=""
          for c in $CANDS; do
            if lftp -e "$CONN; cls -1 '$c/db_config.php'; bye" 2>/dev/null | grep -q 'db_config.php'; then FOUND="$c"; break; fi
          done
          [ -n "$FOUND" ] || { echo "::error::Website-Ordner nicht gefunden"; exit 1; }
          T="$FOUND/teSt/kalender"
          echo "Ziel: $T"
          lftp -e "$CONN; cat '$T/api.php'; bye" > api_check.php 2>/dev/null || true
          if ! grep -q "Familienkalender" api_check.php; then echo "::error::In $T liegt kein Familienkalender – nichts gelöscht"; exit 1; fi
          lftp -e "$CONN; rm -r -f '$T'; bye"
          echo "teSt danach:"; lftp -e "$CONN; cls -1 '$FOUND/teSt/'; bye" || true

      - name: Prüfen
        run: |
          sleep 5
          for u in https://wunsch-fabrik.dk/teSt/kalender/api.php https://www.wunsch-fabrik.dk/teSt/kalender/api.php; do
            r=$(curl -s --max-time 20 "$u?a=ping" || true); echo "$u -> ${r:0:120}"
            if echo "$r" | grep -q '"familienkalender"'; then echo "::error::Test-Kalender antwortet noch"; exit 1; fi
          done
