# Holt Runden aus OpenStreetMap (Hundeauslaufflächen in Deutschland, Rundwanderwege der Heimatregion)
# und lädt sie in den Ordner der Gassirunde-Testversion auf www.wunsch-fabrik.dk (data/osm/).
#
# Läuft, wenn eine Änderung mit „[osm-import]“ in der Beschreibung auf diesen Zweig geschoben wird,
# oder von Hand (Actions → „Gassirunde: Runden aus OpenStreetMap“ → Run workflow).
# Daten: © OpenStreetMap-Mitwirkende, ODbL.
name: "Gassirunde: Runden aus OpenStreetMap"

on:
  workflow_dispatch:
  push:
    branches: ['claude/dog-walking-routes-ounny2']

concurrency:
  group: webspace-upload
  cancel-in-progress: false

env:
  ZIEL: gassi-ljv0zkx2

jobs:
  import:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[osm-import]')
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - name: Runden aus OpenStreetMap holen
        env:
          OVERPASS: https://overpass-api.de/api/interpreter
          OSM_PAUSE: '2'
        run: |
          python3 -u gassi-app/tools/import-osm.py
          cat gassi-app/public/data/osm/index.json
          du -sh gassi-app/public/data/osm

      - name: Ergebnis aufheben
        uses: actions/upload-artifact@v4
        with:
          name: osm-runden
          path: gassi-app/public/data/osm/
          retention-days: 30

      - name: Per SFTP hochladen
        env:
          SFTP_HOST: ${{ secrets.FTP_SERVER }}
          SFTP_USER: ${{ secrets.FTP_USERNAME }}
          LFTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          SFTP_DIR: ${{ secrets.FTP_DIR }}
        run: |
          set -e
          if [ -z "$SFTP_HOST" ] || [ -z "$SFTP_USER" ] || [ -z "$LFTP_PASSWORD" ]; then
            echo "::error::FTP_SERVER, FTP_USERNAME und FTP_PASSWORD fehlen unter Settings → Secrets and variables → Actions."; exit 1
          fi
          sudo apt-get -qq update && sudo apt-get -qq install -y lftp >/dev/null
          CONN="set sftp:auto-confirm yes; set net:max-retries 3; set net:timeout 30; open -u '$SFTP_USER' --env-password 'sftp://$SFTP_HOST'"
          FOUND=""
          if [ -n "$SFTP_DIR" ]; then
            CANDS="$SFTP_DIR"
          else
            LIST=$(lftp -e "$CONN; cls -1 webroots/ webroots/by-route/; bye" 2>/dev/null | sed 's#/*$##; s#@$##' || true)
            CANDS="$LIST httpd.www ."
          fi
          for c in $CANDS; do
            if lftp -e "$CONN; cls -1 '$c/db_config.php'; bye" 2>/dev/null | grep -q 'db_config.php'; then FOUND="$c"; break; fi
          done
          [ -n "$FOUND" ] || { echo "::error::Kein Website-Ordner mit db_config.php gefunden."; exit 1; }
          echo "Ziel: $FOUND/$ZIEL/data/osm"
          lftp -e "$CONN; mkdir -p -f '$FOUND/$ZIEL/data/osm'; mirror --reverse --delete --no-perms --parallel=4 --verbose=1 ./gassi-app/public/data/osm/ '$FOUND/$ZIEL/data/osm'; bye"

      - name: Prüfen
        run: |
          sleep 5
          curl -sS --max-time 30 "https://www.wunsch-fabrik.dk/$ZIEL/api.php?p=routes&lat=54.85&lng=9.36&r=40" | python3 -c "import json,sys; d=json.load(sys.stdin); print('Runden um Padborg:', len(d), '| davon OSM:', sum(1 for r in d if r.get('source')=='osm'))"
          curl -sS --max-time 30 "https://www.wunsch-fabrik.dk/$ZIEL/api.php?p=routes&lat=52.52&lng=13.40&r=20" | python3 -c "import json,sys; d=json.load(sys.stdin); print('Runden um Berlin:', sum(1 for r in d if r.get('source')=='osm'))"
