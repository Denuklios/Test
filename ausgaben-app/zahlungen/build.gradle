plugins { id 'com.android.application' }
android {
  namespace 'de.anderssohn.ausgaben.zahlungen'
  compileSdk 35
  defaultConfig {
    applicationId 'de.anderssohn.ausgaben.zahlungen'
    minSdk 24
    targetSdk 35
    versionCode 1
    versionName '1.0'
  }
  // gleicher Schlüssel wie die Haupt-App – nur dann dürfen sich die Apps Zahlungen schicken
  def ks = rootProject.file('signing/keystore.properties')
  if (ks.exists()) {
    def props = new Properties(); ks.withInputStream { props.load(it) }
    signingConfigs {
      release {
        storeFile rootProject.file(props['storeFile'])
        storePassword props['storePassword']
        keyAlias props['keyAlias']
        keyPassword props['keyPassword']
      }
    }
    buildTypes { release { minifyEnabled false; signingConfig signingConfigs.release } }
  } else {
    buildTypes { release { minifyEnabled false; signingConfig signingConfigs.debug } }
  }
  compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
