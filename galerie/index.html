<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Fotogalerie</title>
  <meta name="description" content="Fotogalerie mit Gesichtserkennung, smarter Suche und lustigen Extras – alles läuft privat auf deinem Gerät.">
  <meta name="theme-color" content="#1f2124">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <header class="topbar">
    <button class="icon-btn back hidden" id="backBtn" aria-label="Zurück"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button>
    <h1 id="title">Fotos</h1>
    <div class="top-actions">
      <button class="icon-btn" id="searchBtn" aria-label="Suchen" title="Suchen"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg></button>
      <button class="icon-btn" id="selectBtn" aria-label="Auswählen" title="Auswählen"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="4"/><path d="M8.5 12.2l2.4 2.4 4.6-5"/></svg></button>
      <button class="icon-btn" id="addBtn" aria-label="Fotos hinzufügen" title="Fotos hinzufügen"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
      <button class="icon-btn" id="settingsBtn" aria-label="Einstellungen" title="Einstellungen"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h9M17 7h3M4 12h3M11 12h9M4 17h11M19 17h1"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="17" cy="17" r="2"/></svg></button>
    </div>
  </header>

  <div id="statusbar" class="statusbar hidden" role="status"></div>

  <div id="selectbar" class="selectbar hidden">
    <button class="icon-btn" id="selCancel" aria-label="Auswahl beenden"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    <span id="selCount">0 ausgewählt</span>
    <div class="spacer"></div>
    <button class="btn small" id="selFav"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20s-7.5-4.6-7.5-10A4.3 4.3 0 0 1 12 7.4 4.3 4.3 0 0 1 19.5 10c0 5.4-7.5 10-7.5 10z"/></svg>Favorit</button>
    <button class="btn small" id="selShow"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5v13l10.5-6.5z"/></svg>Diashow</button>
    <button class="btn small" id="selCarousel"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="8" y="6" width="8" height="12" rx="1.5"/><path d="M5 8v8M19 8v8M2.5 10v4M21.5 10v4"/></svg>Karussell</button>
    <button class="btn small danger" id="selDelete"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4.5 7h15M9.5 7V5h5v2M6.5 7l1 12.5h9l1-12.5M10 10.5v6M14 10.5v6"/></svg>Entfernen</button>
  </div>

  <main id="view"></main>

  <nav class="tabbar" aria-label="Bereiche">
    <a href="#/fotos" data-tab="fotos"><span><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="14" rx="3"/><circle cx="9" cy="10" r="1.6"/><path d="M4 17l5-4.5 3.5 3 3-2.5 4.5 4"/></svg></span>Fotos</a>
    <a href="#/personen" data-tab="personen"><span><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="9" r="3.2"/><path d="M3.5 19c.8-3.2 3-4.8 5.5-4.8s4.7 1.6 5.5 4.8"/><circle cx="17" cy="8.5" r="2.5"/><path d="M16 13.6c2.2 0 3.9 1.3 4.6 4"/></svg></span>Personen</a>
    <a href="#/entdecken" data-tab="entdecken"><span><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M15.5 8.5l-2 5-5 2 2-5z"/></svg></span>Entdecken</a>
    <a href="#/spass" data-tab="spass"><span><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.5l2.4 5 5.4.7-4 3.7 1 5.3L12 15.6 7.2 18.2l1-5.3-4-3.7 5.4-.7z"/></svg></span>Spaß</a>
  </nav>

  <input type="file" id="fileInput" accept="image/*" multiple hidden>
  <input type="file" id="dirInput" webkitdirectory multiple hidden>
  <div id="dropzone" class="dropzone hidden">Fotos hier loslassen</div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
