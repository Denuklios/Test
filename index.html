<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>StickStudio</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header id="menubar">
  <span class="brand">StickStudio</span>
  <div class="menu"><button>Datei</button>
    <div class="dd">
      <button data-cmd="new">Neu</button>
      <button data-cmd="open">Projekt öffnen… <kbd>Strg+O</kbd></button>
      <button data-cmd="save">Projekt speichern <kbd>Strg+S</kbd></button>
      <button data-cmd="library">Design-Bibliothek… <kbd>Strg+B</kbd></button>
      <button data-cmd="librarySave">In Bibliothek speichern</button>
      <hr>
      <button data-cmd="importVector">Vektorgrafik importieren (SVG, PDF, AI)…</button>
      <button data-cmd="importDst">Stickdatei importieren (DST, PES, JEF, EXP)…</button>
      <button data-cmd="exportDst">Stickdatei exportieren (DST, PES, JEF, EXP) <kbd>Strg+E</kbd></button>
      <button data-cmd="teamNames">Teamnamen / Seriennamen…</button>
      <button data-cmd="multiHoop">Auf mehrere Einspannungen verteilen…</button>
      <hr>
      <button data-cmd="worksheet">Arbeitsblatt drucken</button>
      <button data-cmd="garment">Kleidungsvorlage hinter dem Rahmen…</button>
      <button data-cmd="mockup">Produkt-Vorschau (Mockup)…</button>
      <button data-cmd="price">Preiskalkulation &amp; Angebot…</button>
    </div>
  </div>
  <div class="menu"><button>Bearbeiten</button>
    <div class="dd">
      <button data-cmd="undo">Rückgängig <kbd>Strg+Z</kbd></button>
      <button data-cmd="redo">Wiederholen <kbd>Strg+Y</kbd></button>
      <hr>
      <button data-cmd="duplicate">Duplizieren <kbd>Strg+D</kbd></button>
      <button data-cmd="delete">Löschen <kbd>Entf</kbd></button>
      <button data-cmd="selectAll">Alles auswählen <kbd>Strg+A</kbd></button>
      <hr>
      <button data-cmd="mirrorH">Horizontal spiegeln</button>
      <button data-cmd="mirrorV">Vertikal spiegeln</button>
      <button data-cmd="rotate">Drehen…</button>
      <button data-cmd="scale">Skalieren…</button>
      <button data-cmd="center">In Rahmenmitte setzen</button>
      <button data-cmd="array">Kopien anordnen (Kreis / Raster)…</button>
      <button data-cmd="fitHoop">An Rahmen anpassen (Größe)</button>
      <hr>
      <button data-cmd="removeOverlaps">Überlappungen entfernen</button>
      <button data-cmd="union">Formen vereinen</button>
      <button data-cmd="difference">Untere Form ausschneiden (Rest abziehen)</button>
      <button data-cmd="intersect">Schnittmenge</button>
      <hr>
      <button data-cmd="applique">Applikation aus Form…</button>
      <button data-cmd="knockdown">Knockdown-Stich (Frottee, Fleece)…</button>
      <button data-cmd="capSort">Für Kappe sortieren (Mitte → außen, unten → oben)…</button>
      <hr>
      <button data-cmd="toColA">Satinlinie (C) in Satin A umwandeln (Breite frei formen)</button>
      <button data-cmd="toStitches">In Einzelstiche umwandeln</button>
      <button data-cmd="sortColor">Nach Farbe sortieren</button>
      <button data-cmd="optimizeOrder">Reihenfolge optimieren (kürzeste Wege)</button>
      <hr>
      <button data-cmd="check">Stickprüfung…</button>
    </div>
  </div>
  <div class="menu"><button>Anordnen</button>
    <div class="dd">
      <button data-cmd="alignLeft">Links ausrichten</button>
      <button data-cmd="alignCenterH">Waagrecht mittig</button>
      <button data-cmd="alignRight">Rechts ausrichten</button>
      <button data-cmd="alignTop">Oben ausrichten</button>
      <button data-cmd="alignCenterV">Senkrecht mittig</button>
      <button data-cmd="alignBottom">Unten ausrichten</button>
      <hr>
      <button data-cmd="distH">Waagrecht verteilen</button>
      <button data-cmd="distV">Senkrecht verteilen</button>
      <hr>
      <button data-cmd="group">Gruppieren <kbd>Strg+G</kbd></button>
      <button data-cmd="ungroup">Gruppierung lösen <kbd>Strg+Shift+G</kbd></button>
      <hr>
      <button data-cmd="array">Kopien anordnen (Kreis / Raster)…</button>
      <hr>
      <button data-cmd="textOnPath">Text auf Linie setzen…</button>
      <button data-cmd="monogram">Monogramm…</button>
      <p style="margin:4px 10px;color:#6a7480;font-size:11.5px">Ein Objekt: Ausrichten am Rahmen. Mehrere: aneinander.</p>
    </div>
  </div>
  <div class="menu"><button>Bild</button>
    <div class="dd">
      <button data-cmd="insertImage">Bild einfügen…</button>
      <button data-cmd="imageSettings">Bild-Einstellungen…</button>
      <button data-cmd="toggleImage">Bild ein/aus</button>
      <button data-cmd="removeImage">Bild entfernen</button>
      <button data-cmd="fitHoop">Bild/Design an Rahmen anpassen</button>
      <hr>
      <button data-cmd="autoDigitize">Auto-Digitalisieren…</button>
    </div>
  </div>
  <div class="menu"><button>Ansicht</button>
    <div class="dd">
      <button data-cmd="toggleTrue">TrueView (Fadenansicht) <kbd>T</kbd></button>
      <button data-cmd="toggleJumps">Sprünge anzeigen <kbd>J</kbd></button>
      <button data-cmd="toggleGrid">Raster</button>
      <button data-cmd="toggleSnap">Einrasten an Raster/Hilfslinien <kbd>G</kbd></button>
      <button data-cmd="guides">Hilfslinien &amp; Rasterweite…</button>
      <button data-cmd="togglePoints">Einstichpunkte</button>
      <button data-cmd="toggleWheel" data-tipstate="off"><span class="tipchk"></span>Mausrad zoomt (statt scrollen)</button>
      <button data-cmd="zoomFit">Alles zeigen <kbd>0</kbd></button>
      <button data-cmd="zoomHoop">Rahmen zeigen</button>
    </div>
  </div>
  <div class="menu"><button>Einstellungen</button>
    <div class="dd">
      <button data-cmd="machineSettings">Maschine, Schnitte &amp; Sprünge…</button>
      <button data-cmd="hoops">Stickrahmen…</button>
      <button data-cmd="toggleTips" data-tipstate="on"><span class="tipchk"></span>Hilfe-Infos beim Überfahren</button>
      <button data-cmd="help">Hilfe / Tastatur</button>
    </div>
  </div>
  <span class="spacer"></span>
  <span class="langsw" data-noi18n><button data-lang-btn="de" title="Deutsch">DE</button><button data-lang-btn="en" title="English">EN</button></span>
  <label class="hoopbar" title="Stickrahmen">Rahmen <select id="hoopSel"></select></label>
  <button class="tb" id="hoopBtn" title="Rahmen verwalten, eigene Rahmen anlegen, Design einpassen">⬚ Rahmen…</button>
  <button class="tb fit" data-cmd="fitHoop" title="Design bzw. Auswahl an den Rahmen anpassen (Größe + Stiche neu berechnen)">⤢ An Rahmen anpassen</button>
  <button class="tb" data-cmd="undo" title="Rückgängig">↶</button>
  <button class="tb" data-cmd="redo" title="Wiederholen">↷</button>
  <button class="tb primary" data-cmd="exportDst" title="DST exportieren">DST ⤓</button>
</header>

<main>
  <nav id="toolbox">
    <div class="group">Auswahl</div>
    <button data-tool="select" title="Auswählen (Esc)"><b>⬚</b><span>Auswählen</span></button>
    <button data-tool="reshape" title="Umformen (R)"><b>◇</b><span>Umformen</span></button>
    <button data-tool="garment" title="Kleidung unter dem Rahmen verschieben"><b>👕</b><span>Kleidung</span></button>
    <button data-tool="pan" title="Ansicht verschieben (H)"><b>✋</b><span>Verschieben</span></button>
    <div class="group">Linien</div>
    <button data-tool="run" title="Laufstich (offene Form)"><b>┄</b><span>Laufstich</span></button>
    <button data-tool="triple" title="Dreifachstich"><b>☰</b><span>Dreifach</span></button>
    <button data-tool="colC" title="Satinlinie mit fester Breite (Säule C)"><b>▬</b><span>Satin C</span></button>
    <div class="group">Satin frei</div>
    <button data-tool="colA" title="Satin A – Kanten abwechselnd anklicken, Breite frei"><b>⫽</b><span>Satin A</span></button>
    <button data-tool="colB" title="Satin B – erst eine Kante, Enter, dann die andere"><b>∥</b><span>Satin B</span></button>
    <div class="group">Flächen</div>
    <button data-tool="fill" title="Geschlossene Form (Tatami-Füllung)"><b>▰</b><span>Fläche</span></button>
    <button data-tool="rect" title="Rechteck"><b>▭</b><span>Rechteck</span></button>
    <button data-tool="ellipse" title="Kreis / Ellipse"><b>◯</b><span>Ellipse</span></button>
    <button data-tool="text" title="Schrift"><b>A</b><span>Text</span></button>
    <button data-tool="knife" title="Messer: Flächen entlang einer Linie teilen"><b>✂</b><span>Messer</span></button>
    <div class="group">Stiche</div>
    <button data-tool="manual" title="Manuell: jeder Klick ein Stich, Rechtsklick = Sprung"><b>✚</b><span>Manuell</span></button>
    <div class="group">Touch</div>
    <button id="curveMode" title="Für Touch: Tippen setzt Kurvenpunkte"><b>∿</b><span>Kurve</span></button>
  </nav>

  <section id="stage">
    <canvas id="cv"></canvas>
    <div id="hint"></div>
    <div id="garmentBox" class="hidden"></div>
  </section>

  <aside id="side">
    <section class="panel">
      <h3>Stoff <small>(passt Stiche automatisch an)</small></h3>
      <select id="material" style="width:100%"></select>
      <div id="fabricInfo"></div>
    </section>
    <section class="panel">
      <h3>Eigenschaften <small id="propTitle"></small></h3>
      <div id="props"></div>
    </section>
    <section class="panel">
      <h3>Farben <small>(Klick = aktiv / zuweisen)</small></h3>
      <div id="palette"></div>
      <div class="row"><button data-cmd="addColor">+ Farbe</button><button data-cmd="editColor">Bearbeiten</button><button data-cmd="delColor">− Entfernen</button><button data-cmd="threadBrand" title="Allen Farben echte Garne einer Marke zuordnen">Garnmarke…</button></div>
    </section>
    <section class="panel grow">
      <h3>Reihenfolge <small>(oben = zuerst gestickt)</small></h3>
      <div id="objlist"></div>
      <div class="row"><button data-cmd="moveUp">▲</button><button data-cmd="moveDown">▼</button><button data-cmd="moveFirst">⤒</button><button data-cmd="moveLast">⤓</button><button data-cmd="delete">🗑</button></div>
    </section>
  </aside>
</main>

<footer id="statusbar">
  <div class="player">
    <button id="playBtn" title="Sticksimulation">▶</button>
    <input id="playSlider" type="range" min="0" max="0" value="0">
    <select id="playSpeed"><option value="20">langsam</option><option value="100" selected>normal</option><option value="600">schnell</option><option value="3000">sehr schnell</option></select>
  </div>
  <span id="stats"></span>
  <button id="checkInfo" title="Stickprüfung"></button>
  <span id="coords"></span>
  <button id="tipToggle" data-cmd="toggleTips" data-tipstate="on" data-help="id:tipToggle">ⓘ</button>
</footer>

<div id="modal" class="hidden"><div class="box"><h2 id="modalTitle"></h2><div id="modalBody"></div><div class="row end" id="modalBtns"></div></div></div>
<input type="file" id="fileInput" class="hidden">

<script src="js/i18n.js"></script>
<script src="js/i18n/en_a.js"></script>
<script src="js/i18n/en_b.js"></script>
<script src="js/i18n/en_c.js"></script>
<script src="js/i18n/en_d.js"></script>
<script src="js/geometry.js"></script>
<script src="js/stitchgen.js"></script>
<script src="js/fabric.js"></script>
<script src="js/check.js"></script>
<script src="js/route.js"></script>
<script src="js/hoops.js"></script>
<script src="js/vector.js"></script>
<script src="js/boolean.js"></script>
<script src="js/fills.js"></script>
<script src="js/zip.js"></script>
<script src="js/threads.js"></script>
<script src="js/dst.js"></script>
<script src="js/dst_io.js"></script>
<script src="js/formats.js"></script>
<script src="js/satinauto.js"></script>
<script src="js/scan.js"></script>
<script src="js/autodigitize.js"></script>
<script src="js/fonts.js"></script>
<script src="js/inkfont.js"></script>
<script src="js/textfx.js"></script>
<script src="js/stickfonts/index.js"></script>
<script src="js/help.js"></script>
<script src="js/help_dialogs.js"></script>
<script src="js/garment_assets.js"></script>
<script src="js/garments.js"></script>
<script src="js/app.js"></script>
</body>
</html>
