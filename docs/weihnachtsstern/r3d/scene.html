const scene = new THREE.Scene();

// ---------- materials
function rand(s) { let x = Math.sin(s) * 10000; return x - Math.floor(x); }

    g.strokeStyle = `rgba(${base[0] * dark | 0},${base[1] * dark * 0.95 | 0},${base[2] * dark * 0.85 | 0},${0.25 + rand(i + seed * 5) * 0.4})`;
    g.lineWidth = 0.6 + rand(i * 11 + seed) * 2.2;

const PAINT = P.get('paint');
const woodMats = [1, 2, 3, 4].map(s => PAINT === 'white'
  ? new THREE.MeshStandardMaterial({ color: 0xf3eee6, roughness: 0.55 })
  : new THREE.MeshStandardMaterial({ map: woodTexture(s), roughness: 0.75 }));
const topMat = PAINT === 'white' ? woodMats[0] : new THREE.MeshStandardMaterial({ map: woodTexture(9, [226, 196, 156]), roughness: 0.7 });
const steel = new THREE.MeshStandardMaterial({ color: 0xd4d9de, metalness: 0.55, roughness: 0.38, envMapIntensity: 4 });
const zinc = new THREE.MeshStandardMaterial({ color: 0xe6dcb0, metalness: 0.7, roughness: 0.3, envMapIntensity: 4 });
const hingeMat = new THREE.MeshStandardMaterial({ color: 0x8a8f96, metalness: 0.8, roughness: 0.4 });

// ---------- geometry helpers (units: cm). Lying layout: ground = XZ, up = Y.
// Klappbock modelled after the classic beech trestle: 2 frames, each 2 legs + bottom rung,
// double top rail, metal spreader rods on both sides.
const LEG = 80, SD = 2.4, SW = 4.4, HF = 68, LIFT = 2.0, HALF = 18 * Math.PI / 180;
function box(lx, ly, lz, mat) {
  const m = new THREE.Mesh(new RoundedBoxGeometry(lx, ly, lz, 2, Math.min(lx, ly, lz) * 0.15), mat);
  m.castShadow = m.receiveShadow = true; return m;
}
function beamXZ(p, q, y0, w, h, mat) { // p,q: Vector2(x,z); w = horizontal thickness, h = vertical
  const d = q.clone().sub(p), len = d.length();
  const m = box(len, h, w, mat);
  m.position.set((p.x + q.x) / 2, y0 + h / 2, (p.y + q.y) / 2);
  m.rotation.y = -Math.atan2(d.y, d.x);
  return m;
}
const v2 = (x, y) => new THREE.Vector2(x, y);
const perp = d => v2(-d.y, d.x);
let mi = 0;
const brass = new THREE.MeshStandardMaterial({ color: 0xd8b85a, metalness: 0.9, roughness: 0.3 });
function cyl(a3, b3, r, mat) {
  const d = b3.clone().sub(a3), len = d.length();
  const m = new THREE.Mesh(new THREE.CylinderGeometry(r, r, len, 16), mat);
  m.position.copy(a3.clone().add(b3).multiplyScalar(.5));

  m.castShadow = true; g_last.add(m); return m;

let g_last = null;
function frameLying(g, tip, foot) {
  const mat = woodMats[(mi++) % 4];

  g.add(beamXZ(tip, foot, LIFT + HF - SW, SD, SW, mat));       // top leg
  const d = foot.clone().sub(tip), u = d.clone().normalize();
  const c = foot.clone().sub(u.clone().multiplyScalar(14));     // bottom rung ~14 cm above the floor

function bockLying(g, tip, out, feet) {

  const n = perp(out);
  for (const s of [-1, 1]) {
    const c = tip.clone().add(out.clone().multiplyScalar(0.6)).add(n.clone().multiplyScalar(s * 1.45));
    const rail = box(4.0, HF + 2 * LIFT, 2.8, topMat);

  for (const yy of [LIFT + SW + 1.2, LIFT + HF - SW - 1.2]) {
    const A3 = new THREE.Vector3(pA.x, yy, pA.y), B3 = new THREE.Vector3(pB.x, yy, pB.y);
    const M3 = A3.clone().add(B3).multiplyScalar(.5).add(new THREE.Vector3(out.x, 0, out.y).multiplyScalar(2.5));
    cyl(A3, M3, 0.35, brass); cyl(M3, B3, 0.35, brass);

  }

const R = 1.376 * LEG, r = 0.382 * R;
function starPts() {
  const tips = [], inner = [];

    const a = (90 + 72 * k) * Math.PI / 180, b = (126 + 72 * k) * Math.PI / 180;
    tips.push(v2(R * Math.cos(a), -R * Math.sin(a)));

}
// leg end at a joint: legs stop 0.9 cm past the joint point so their outer faces meet exactly in the corner

const screwHeadGeo = new THREE.SphereGeometry(0.42, 20, 10, 0, Math.PI * 2, 0, Math.PI / 2);
const darkMat = new THREE.MeshStandardMaterial({ color: 0x4d4a40, metalness: .6, roughness: .5 });

    const fl = new THREE.Mesh(new THREE.BoxGeometry(len, hgt, th), steel);
    fl.position.set(c.x, yc, c.y); fl.rotation.y = -Math.atan2(e.y, e.x); fl.castShadow = true; g.add(fl);

// loose part: Winkelverbinder 90° as bought

  const b = new THREE.Mesh(new THREE.BoxGeometry(th, len, w), steel); b.position.set(th / 2, len / 2, 0); b.castShadow = true; g.add(b);
  for (const f of [1.2, 3.0]) {

    const h2 = new THREE.Mesh(new THREE.CylinderGeometry(0.25, 0.25, th + 0.02, 20), darkMat); h2.rotation.z = Math.PI / 2; h2.position.set(th / 2, f, 0); g.add(h2);

  const shank = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.2, 1.4, 16), zinc); shank.rotation.z = Math.PI / 2; shank.position.x = 0.7; s.add(shank);

// ---------- lights

  scene.environmentIntensity = 0.3;

  const d = new THREE.DirectionalLight(0xffffff, 2.0);
  d.position.set(target.x - size * 0.8, target.y + size * 1.6, target.z + size * 1.1);
  d.target.position.copy(target);
  d.castShadow = true; d.shadow.mapSize.set(4096, 4096);
  const s = d.shadow.camera; s.left = -size; s.right = size; s.top = size; s.bottom = -size; s.near = 1; s.far = size * 6;

const meta = {};
let camera;

}

let composer = null;

  const s = 122;
  camera = new THREE.OrthographicCamera(-s * Wpx / Hpx, s * Wpx / Hpx, s, -s, 1, 2000);
  camera.position.set(0, 600, -8); camera.up.set(0, 0, -1); camera.lookAt(0, 0, -8);
  meta.center = project(V(0, HF, 0));

    g.rotation.x = Math.PI / 2;
    g.position.z = -(HF + 2 * LIFT) / 2;

  const trees = [[-260, -120, 1.25], [-330, -260, 1.4], [-190, -330, 1.1], [280, -150, 1.3], [360, -300, 1.5], [200, -380, 1.0], [-480, -500, 1.6], [520, -520, 1.7]];
  for (const [x, z, s] of trees) {
    const t = new THREE.Group();
    const tr = new THREE.Mesh(new THREE.CylinderGeometry(5, 6, 30, 10), trunk); tr.position.y = 15; t.add(tr);
    for (let k = 0; k < 4; k++) {
      const rad = 62 - k * 13, hh = 70 - k * 8, y0 = 25 + k * 38;
      const cone = new THREE.Mesh(new THREE.ConeGeometry(rad, hh, 18), fir); cone.position.y = y0 + hh / 2; cone.castShadow = true; t.add(cone);
      const cap = new THREE.Mesh(new THREE.ConeGeometry(rad * 0.62, hh * 0.38, 18), snowTop); cap.position.y = y0 + hh * 0.81; t.add(cap);
    }
    t.position.set(x, -2, z); t.scale.setScalar(s); scene.add(t);
  }
  const sg = new THREE.BufferGeometry(); const arr = [];
  for (let i = 0; i < 700; i++) { arr.push((rand(i) - .5) * 3000, 200 + rand(i + 9) * 900, -900 - rand(i + 3) * 300); }
  sg.setAttribute('position', new THREE.Float32BufferAttribute(arr, 3));
  scene.add(new THREE.Points(sg, new THREE.PointsMaterial({ color: 0xffffff, size: 2.2, sizeAttenuation: false, transparent: true, opacity: .8, fog: false })));
  const fg = new THREE.BufferGeometry(); const fa = [];
  for (let i = 0; i < 900; i++) { fa.push((rand(i * 3) - .5) * 900, rand(i * 5) * 420, (rand(i * 7) - .5) * 700); }
  fg.setAttribute('position', new THREE.Float32BufferAttribute(fa, 3));
  scene.add(new THREE.Points(fg, new THREE.PointsMaterial({ color: 0xffffff, size: 2.2, transparent: true, opacity: .75 })));
  const cy = holder.position.y;
  const cx = +P.get('cx') || 70;
  persp(+P.get('fov') || 38, V(cx, 80, +P.get('cz') || 430), V(0, cy - 12, 0));
  composer = new EffectComposer(renderer);
  composer.addPass(new RenderPass(scene, camera));
  composer.addPass(new UnrealBloomPass(new THREE.Vector2(Wpx, Hpx), 0.9, 0.55, 0.82));
  composer.addPass(new OutputPass());
}

if (composer) composer.render(); else renderer.render(scene, camera);
window.__meta = meta;
